  <!-- reticências digitadas dentro do balão -->
  <circle cx="186" cy="204" r="16" fill="url(#bg)"/>
  <circle cx="256" cy="204" r="16" fill="url(#bg)"/>
  <circle cx="326" cy="204" r="16" fill="url(#bg)"/>

  <!-- segundo balão (eco / multiplataforma) -->
