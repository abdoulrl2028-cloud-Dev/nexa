# Configuração do Alembic do NEXA.
# A URL do banco vem de DATABASE_URL (lida em alembic/env.py via app.config) —
# nada de secrets aqui.

[alembic]
script_location = alembic
prepend_sys_path = .
# Em produção use sempre `alembic upgrade head` (via run.sh / release step do CI).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S