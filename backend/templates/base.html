<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ seo.title }}</title>
  <meta name="description" content="{{ seo.description }}">
  {% if seo.keywords %}<meta name="keywords" content="{{ seo.keywords }}">{% endif %}
  {% if seo.robots %}<meta name="robots" content="{{ seo.robots }}">{% else %}<meta name="robots" content="index, follow, max-image-preview:large">{% endif %}
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Open Graph -->
  <meta property="og:type" content="{{ seo.og_type }}">
  <meta property="og:site_name" content="NEXA">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ seo.og_image }}">
  <meta property="og:locale" content="pt_BR">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo.title }}">
  <meta name="twitter:description" content="{{ seo.description }}">
  <meta name="twitter:image" content="{{ seo.og_image }}">

  {% if seo.json_ld %}<script type="application/ld+json">{{ seo.json_ld | tojson }}</script>{% endif %}

  <link rel="stylesheet" href="/static/css/app.css?{{ css_ver }}">
</head>
<body class="public">
  {% block body %}{% endblock %}
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
