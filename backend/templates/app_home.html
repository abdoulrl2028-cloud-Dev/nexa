{% extends "app_base.html" %}
{% block app %}
<div class="page app-feed-page">
  <section class="stories" id="stories">
    <a class="story-card" href="/app/story">
      <span class="story-add">＋</span>
      <span class="story-name">Você</span>
    </a>
    {% for s in stories %}
      <div class="story-card" data-story="{{ s.id }}">
        {% if s.media %}<img src="{{ s.media.url }}" alt="" loading="lazy">{% endif %}
        <span class="story-name">{{ s.owner.display_name }}</span>
      </div>
    {% endfor %}
  </section>

  <section class="composer card" id="composer">
    <form data-act="create-post">
      <input name="title" placeholder="Título (opcional, vira URL amigável)" maxlength="160">
      <textarea name="content" placeholder="No que você está pensando?" required></textarea>
      <div class="composer-actions">
        <select name="visibility">
          <option value="public">Público</option>
          <option value="friends">Amigos</option>
          <option value="private">Privado</option>
        </select>
        <label class="btn-ghost file-btn">📎 <input type="file" name="media[]" multiple accept="image/*,video/*" hidden></label>
        <span class="upload-status" data-upload-status></span>
        <input type="hidden" name="media_keys" value="">
        <button class="btn btn-primary" type="submit">Publicar</button>
      </div>
    </form>
  </section>

  <section class="feed" id="app-feed">
    {% for p in feed %}
      {% include "_postcard.html" %}
    {% endfor %}
    <p class="empty" id="feed-end" hidden>Você está em dia 🎉</p>
  </section>
</div>
{% endblock %}
