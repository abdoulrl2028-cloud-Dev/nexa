{% extends "base.html" %}
{% block body %}
<header class="topbar public-nav">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="logo">N</span><span class="brand-name">NEXA</span></a>
  </div>
</header>
<main class="auth-wrap">
  <form class="auth-box" id="register-form" novalidate>
    <h1>Criar conta</h1>
    <label>Usuário
      <input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="ex.: ana_silva">
    </label>
    <label>Nome (opcional)
      <input name="display_name" maxlength="64" autocomplete="name" placeholder="Seu nome público">
    </label>
    <label>Senha (mín. 8)
      <input name="password" type="password" required minlength="8" autocomplete="new-password">
    </label>
    <p class="form-error" data-error></p>
    <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
    <p class="muted center">Já tem conta? <a href="/login">Entrar</a></p>
  </form>
</main>
<script src="/static/js/app.js?{{ js_ver }}" defer></script>
{% endblock %}
