[package]
name = "nexa-desktop"
version = "0.1.0"
description = "Cliente desktop do NEXA (Tauri v2)"
edition = "2021"

[lib]
name = "nexa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# controlled by the `--features` flags used to compile
custom-protocol = ["tauri/custom-protocol"]