name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: nexa/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        working-directory: nexa/backend
        run: pytest tests -q --no-header

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (se instalado) 
        working-directory: nexa/backend
        run: |
          pip install ruff || true
          ruff check app/ || echo "::warning::ruff não configurado — passe a configurar se quiser lints"

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: nexa
          file: nexa/deploy/Dockerfile
          push: false
          tags: nexa/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging (exemplo de switch)
        run: |
          echo "-> Abrir switch de deploy do ambiente staging"
          # Exemplo com a plataforma preferida (VPS/CPanel/Fly/Railway/Dokku).

  approve-prod:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/staging'
    environment: production-approval
    steps:
      - run: echo "Aprovação manual para produção necessária"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [approve-prod]
    if: github.ref == 'refs/heads/staging'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy produção
        run: |
          echo "-> Deploy real de produção aqui (SSH/Dokku/Fly)."